group 'dev.bessems.usbserial'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()                                      // CHANGED: jcenter() → mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.0'    // CHANGED: 4.1.0 → 8.7.0
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()                                      // CHANGED: jcenter() → mavenCentral()
        maven { url "https://jitpack.io" }
    }

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'                              // ADDED: needed for AGP 9

android {
    compileSdk 36                                           // CHANGED: compileSdkVersion 33 → compileSdk 36

    namespace 'dev.bessems.usbserial'

    defaultConfig {
        minSdk 21                                           // CHANGED: 16 → 21 (Flutter 3.47 min)
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17          // CHANGED: 1.8 → 17
        targetCompatibility JavaVersion.VERSION_17          // CHANGED: 1.8 → 17
    }
}

dependencies {
    implementation 'com.github.felHR85:UsbSerial:6.1.0'
}
